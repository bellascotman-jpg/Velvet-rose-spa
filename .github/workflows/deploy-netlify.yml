name: Deploy Velvet Rose to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build static site
        run: npm run build

      - name: Deploy to the existing Velvet Rose Netlify site
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: "003d5ef9-97d7-42c2-8e77-066af3d93f43"
        run: npx --yes netlify-cli deploy --prod --dir=public --functions=netlify/functions --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"

      - name: Explain skipped deployment
        if: ${{ env.NETLIFY_AUTH_TOKEN == '' }}
        run: echo "Deployment skipped. Add the NETLIFY_AUTH_TOKEN repository secret to enable production deploys."
